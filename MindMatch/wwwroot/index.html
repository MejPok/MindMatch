<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rev="stylesheet" href="style.css">
    <script src="script.js" async></script>
    <link rel="stylesheet" href="style.css">
    <title>MindMatch</title>
</head>
<body>
    <header>
        &shy;
        <h1>
            Mind Match
        </h1>
    </header>
    <main>
        <div id="playField">
        </div>

        <div id="gameScreen">
            <div class="gameHeader">
                <h2 id="numberOfPlayers">
                    1 / 3 players
                </h2>

                <h2 id="roomCodeParagraph">
                    room code: 1748
                </h2>

                <input type="button" value="Next Phase" id="nextPhaseButton">

                <h3 id="phaseInfo">
                    Round 1, Not started
                </h3>
            </div>


            <div id="questionField">
                <h1 type="text" id="questionDiv">
                    What is your name
                </h1>

                <input type="text" id="questionInput" required="">

                <input type="button" value="Submit answer" id="submitQuestionButton">

            </div>

            

        </div>
        
        <div id="scoreBoard">
            
        </div>
        
    </main>
</body>
</html>
